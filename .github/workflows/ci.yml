name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

# A PR's runs are grouped by its number, so a merged PR's "closed" run can't cancel main's deploy.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

permissions:
  contents: read

# Secrets are given only to the steps that use them, never to a job's `npm ci`, whose packages' install
# scripts would otherwise see them: each of those steps names them in its own `env`.

jobs:
  # Everything `npm run check` does except the Worker's unit tests, which run in parts beside it (`unit`).
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: typecheck and build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run test:rest
      - run: npm run build
      - run: npm run extension:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-dist
          path: extension/dist
          if-no-files-found: error

  # The Worker's unit tests, in three parts at once. On one runner they took six and a half minutes however their files
  # were split, as they need more than its cores. vitest.config.ts deals the files out in path order, so each part gets
  # its share of the access matrix.
  unit:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: unit (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/3

  # The one check called `check`, which branch protection requires: it passes only when the build and every part of
  # the unit tests passed. It runs even in a cancelled run, to fail there: a required check that is skipped passes.
  check:
    needs: [build, unit]
    if: ${{ always() && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - name: The build and every unit part passed
        run: |
          echo "The build finished with ${{ needs.build.result }}, the unit parts with ${{ needs.unit.result }}"
          [ "${{ needs.build.result }}" = success ] && [ "${{ needs.unit.result }}" = success ]

  # Every PR gets a Preview at https://pr-<number>-common-ink-v3-previews.draftox.workers.dev with its own D1
  # database, open without a login, linked from one comment that each push updates. Previews run on their own
  # Worker, common-ink-v3-previews, which the first Preview creates; production's workers.dev address serves HTML embeds alone.
  # Uploads go to the bucket Previews share, common-ink-v3-uploads-preview, so the token needs Workers R2 Storage: Edit.
  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - name: Check Cloudflare credentials
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ "$HAS_TOKEN" = true ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && exit 0
          echo "::error::Add the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable to this repository to enable Previews."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run preview -- --name "pr-${{ github.event.pull_request.number }}" --message "${{ github.event.pull_request.head.sha }}"
      - name: Wait for it to answer
        run: |
          for _ in $(seq 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deploy.outputs.deployment_url }}/api/me")" = 200 ] && exit 0
            sleep 2
          done
          echo "::error::The Preview didn't answer"; exit 1
      - name: Link it from the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- common-ink-preview -->'
          body="$marker
          ### Preview
          **$URL**

          Opens signed in as a dev user, with its own database. Updated for ${SHA:0:7}."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null; fi

  # The browser tests run in Chromium in six parts at once. Each part builds the app and runs its own Worker on its
  # runner, with a local D1 and R2 (scripts/built-worker.ts), so no part waits on a server the others
  # load. They don't use the Preview, which is for people to look at. They start beside the build and the unit tests
  # rather than after them, as nothing they run is made there, and run three browsers at once: with four, the one Worker each part runs
  # fell behind, and tests timed out waiting on it.
  browser-shard:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: browser (${{ matrix.shard }}/6)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run build
      - name: Start the built Worker
        run: |
          node scripts/built-worker.ts --port 8787 > worker.log 2>&1 &
          for _ in $(seq 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/api/me)" = 200 ] && exit 0
            sleep 2
          done
          cat worker.log; echo "::error::The built Worker didn't answer"; exit 1
      - run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/6 --workers=3
        env:
          BASE_URL: http://localhost:8787
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  # Firefox and WebKit run only the smoke test, in one job beside the shards, so CI takes about as long as
  # before. Their browsers are cached under their own key: the shards' cache holds only Chromium.
  browser-others:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: browser (Firefox and WebKit)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-webkit-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox webkit
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps firefox webkit
      - run: npm run build
      # On https, with wrangler's own certificate: WebKit keeps the Secure session cookie only from https, even on localhost.
      - name: Start the built Worker
        run: |
          node scripts/built-worker.ts --port 8787 --https > worker.log 2>&1 &
          for _ in $(seq 60); do
            [ "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8787/health)" = 200 ] && exit 0
            sleep 2
          done
          cat worker.log; echo "::error::The built Worker didn't answer"; exit 1
      - run: npx playwright test --project=firefox --project=webkit --workers=2
        env:
          BASE_URL: https://localhost:8787
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: blob-report-others
          path: blob-report/
          retention-days: 1

  # The one check called `browser`, which branch protection can require: it passes only when every part
  # passed, and when one failed it merges their reports, traces included, into the `playwright-report` artifact.
  browser:
    needs: [browser-shard, browser-others]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    env:
      FAILED: ${{ needs.browser-shard.result != 'success' || needs.browser-others.result != 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.FAILED == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.FAILED == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.FAILED == 'true'
        run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.FAILED == 'true'
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - if: env.FAILED == 'true'
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.FAILED == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Every part passed
        run: |
          echo "The Chromium parts finished with ${{ needs.browser-shard.result }}, Firefox and WebKit with ${{ needs.browser-others.result }}"
          [ "$FAILED" = false ]

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run preview -- --name "pr-${{ github.event.pull_request.number }}" --delete

  # Main goes live at PRODUCTION_DOMAIN and www.PRODUCTION_DOMAIN (the Worker 301s www to the apex, see
  # src/worker/hosts.ts; a deploy that leaves www out detaches it). Until that variable is set, nothing deploys, so merging can't
  # take commonink.app from v2 before the cutover is chosen.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
    steps:
      - name: Skip without a production domain
        if: env.PRODUCTION_DOMAIN == ''
        run: echo "::notice::PRODUCTION_DOMAIN isn't set, so main isn't deployed."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.PRODUCTION_DOMAIN != ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.PRODUCTION_DOMAIN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.PRODUCTION_DOMAIN != ''
        run: npm ci
      - name: Deploy
        if: env.PRODUCTION_DOMAIN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          ALLOWED_EMAILS: ${{ vars.ALLOWED_EMAILS }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          # Seals each person's Google tokens. Without it none is kept, and Calendar and Contacts aren't offered.
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: |
          # The list is who may use Common Ink at all, and an empty one would let nobody in, sessions and agents included.
          [ -n "$ALLOWED_EMAILS" ] || { echo "::error::Set the ALLOWED_EMAILS variable before deploying."; exit 1; }
          jq -n --arg g "$GOOGLE_CLIENT_SECRET" --arg s "$SESSION_SECRET" --arg t "$TOKEN_KEY" '{GOOGLE_CLIENT_SECRET: $g, SESSION_SECRET: $s, TOKEN_KEY: $t} | with_entries(select(.value != ""))' > "$RUNNER_TEMP/secrets.json"
          npm run deploy -- --domain "$PRODUCTION_DOMAIN" --domain "www.$PRODUCTION_DOMAIN" --secrets-file "$RUNNER_TEMP/secrets.json" \
            --var "GOOGLE_CLIENT_ID:$GOOGLE_CLIENT_ID" --var "ALLOWED_EMAILS:$ALLOWED_EMAILS"
          rm "$RUNNER_TEMP/secrets.json"
