name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

# A PR's runs are grouped by its number, so a merged PR's "closed" run can't cancel main's deploy.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check

  # Every PR gets a Preview at https://pr-<number>-common-ink-v3.draftox.workers.dev with its own D1
  # database, open without a login, linked from one comment that each push updates.
  # Uploads go to the bucket Previews share, common-ink-v3-uploads-preview, so the token needs Workers R2 Storage: Edit.
  preview:
    needs: check
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - name: Check Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::Add the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable to this repository to enable Previews."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: deploy
        run: npm run preview -- --name "pr-${{ github.event.pull_request.number }}" --message "${{ github.event.pull_request.head.sha }}"
      - name: Wait for it to answer
        run: |
          for _ in $(seq 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deploy.outputs.deployment_url }}/api/me")" = 200 ] && exit 0
            sleep 2
          done
          echo "::error::The Preview didn't answer"; exit 1
      - name: Link it from the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- common-ink-preview -->'
          body="$marker
          ### Preview
          **$URL**

          Opens signed in as a dev user, with its own database. Updated for ${SHA:0:7}."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null; fi

  # The browser tests run in six parts at once against the same Preview. Each test signs in as its own
  # new person, so the parts share nothing but the Preview's database.
  browser-shard:
    needs: preview
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: browser (${{ matrix.shard }}/6)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/6 --workers=2
        env:
          BASE_URL: ${{ needs.preview.outputs.deployment_url }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  # The one check called `browser`, which branch protection can require: it passes only when every part
  # passed, and when one failed it merges their reports, traces included, into the `playwright-report` artifact.
  browser:
    needs: [preview, browser-shard]
    if: ${{ !cancelled() && needs.preview.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      FAILED: ${{ needs.browser-shard.result != 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.FAILED == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.FAILED == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.FAILED == 'true'
        run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.FAILED == 'true'
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - if: env.FAILED == 'true'
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.FAILED == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Every part passed
        run: |
          echo "The browser parts finished with: ${{ needs.browser-shard.result }}"
          [ "$FAILED" = false ]

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preview -- --name "pr-${{ github.event.pull_request.number }}" --delete

  # Main goes live at PRODUCTION_DOMAIN and www.PRODUCTION_DOMAIN (the Worker 301s www to the apex, see
  # src/worker/hosts.ts; a deploy that leaves www out detaches it). Until that variable is set, nothing deploys, so merging can't
  # take commonink.app from v2 before the cutover is chosen.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      ALLOWED_EMAILS: ${{ vars.ALLOWED_EMAILS }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      # Seals each person's Google tokens. Without it none is kept, and Calendar and Contacts aren't offered.
      TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
    steps:
      - name: Skip without a production domain
        if: env.PRODUCTION_DOMAIN == ''
        run: echo "::notice::PRODUCTION_DOMAIN isn't set, so main isn't deployed."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.PRODUCTION_DOMAIN != ''
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.PRODUCTION_DOMAIN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.PRODUCTION_DOMAIN != ''
        run: npm ci
      - name: Deploy
        if: env.PRODUCTION_DOMAIN != ''
        run: |
          jq -n --arg g "$GOOGLE_CLIENT_SECRET" --arg s "$SESSION_SECRET" --arg t "$TOKEN_KEY" '{GOOGLE_CLIENT_SECRET: $g, SESSION_SECRET: $s, TOKEN_KEY: $t} | with_entries(select(.value != ""))' > "$RUNNER_TEMP/secrets.json"
          npm run deploy -- --domain "$PRODUCTION_DOMAIN" --domain "www.$PRODUCTION_DOMAIN" --secrets-file "$RUNNER_TEMP/secrets.json" \
            --var "GOOGLE_CLIENT_ID:$GOOGLE_CLIENT_ID" --var "ALLOWED_EMAILS:$ALLOWED_EMAILS"
          rm "$RUNNER_TEMP/secrets.json"
