<!doctype html>
<!--
  PROTOTYPE — throwaway. Not production code. Issue #53.
  Question: where do the panel toggles live, and how do the left panels give way as the window narrows?
  Five structurally different answers on one fake shell, switchable via ?v=A|B|C|D|E and the floating bar (or ← / →).
  Round three adds H (today's shell, the note-list column replaced by folder tabs; ?h=1|2, ?x=short|full).
  Round five adds Q4 (?q=4, the default; ?grid=0|1): a separated list of cards modelled on v1's Notes feed (paudrow/commonink, web/src/notesPage.ts).
  Round four quiets H's folder tab: ?q=1|2|3 (river, quiet list, one at a time); ?q=0 is round three's.
  Round two adds F (B with the panel order fixed) and G (a folder opens as a tab; ?g=1|2|3 picks what a note click does).
  Open this file directly in a browser. No build, no persistence; all state (including panel widths) is in memory.
  Follows prototypes/layout/ on the branch prototype/layout, which chose today's three-column layout.
-->
<html lang="en">

<style>
  /* Tokens copied from src/web/style.css */
  :root {

  button.label.lbtn { width: 100%; border-radius: 6px; cursor: pointer; } button.label.lbtn:hover { background: var(--hover); color: var(--muted); }
  .lbtn span { display: inline-flex; align-items: center; gap: 5px; } .lbtn svg { width: 12px; height: 12px; }
  .rel { position: relative; display: block; } .rail .rel, .iconrow .rel { display: inline-block; }
  .menu.side { top: 0; left: calc(100% + 8px); } .menu.end { left: auto; right: 0; }

  .back:hover { background: var(--accent-soft); }

  .list-tools { display: flex; flex-direction: column; gap: 8px; padding: 4px 8px 10px; border-bottom: 1px solid var(--line); }
  .filter { width: 100%; padding: 5px 9px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
  .pills { display: flex; gap: 5px; overflow: hidden; }
  .pill { font-size: 11.5px; padding: 1px 8px; border: 1px solid var(--line-strong); border-radius: 99px; color: var(--muted); white-space: nowrap; }

  .tg:hover, .tg.on { background: var(--hover); color: var(--ink); } .tg.on svg { color: var(--accent); }
  .tg.auto::before { content: ""; position: absolute; left: 17px; top: 3px; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--accent); background: var(--bg-side); }

  /* C: status bar + merged column */
  .status { display: flex; flex: none; align-items: center; gap: 6px; height: 28px; padding: 0 6px; background: var(--bg-side); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .status .tg { height: 22px; font-size: 12px; }
  .iconrow { display: flex; justify-content: space-between; padding: 0 10px 6px; }
  .p-nav .ws { margin: 8px 8px 6px; width: auto; }

  /* E: stepper */

  .steps button { display: inline-grid; place-items: center; width: 28px; height: 24px; color: var(--muted); position: relative; }

  /* round two: F and G */
  .phead { display: flex; flex: none; align-items: center; height: 30px; padding: 0 0 0 9px; font-size: 12px; color: var(--muted); }
  .p-list .phead { padding: 6px 6px 0 14px; height: 38px; color: var(--ink); } .p-list .phead b { font-size: 15px; }
  .itabs .x { align-self: center; margin-right: -8px; }

  .fview { max-width: 760px; margin: 0 auto; }

  .crumbs button { color: var(--accent); font-weight: 600; padding: 1px 4px; border-radius: 5px; } .crumbs button:hover { background: var(--accent-soft); } .crumbs svg { width: 11px; height: 11px; }

  .newnote { padding: 3px 10px; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 600; white-space: nowrap; }

  .kid:hover { background: var(--hover); } .kid svg { color: var(--muted); } .kid .n { color: var(--faint); font-size: 12px; }
  .dropping { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--accent-soft); }
  .note[draggable] { cursor: grab; }
  .empty { margin: auto; text-align: center; color: var(--muted); } .empty button { color: var(--accent); font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 14px; } .cards div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg-elev); font-size: 13px; }

  /* round three: H */
  .wsrow { display: flex; gap: 2px; align-items: flex-start; } .wsrow .ws { flex: 1; min-width: 0; } .wsrow .icon-button { margin-top: 6px; }
  .hnote { border-bottom: 1px solid var(--line); } .hnote.open { background: var(--bg-elev); }
  .hrow { display: flex; gap: 6px; padding: 9px 14px 9px 8px; cursor: pointer; } .hrow:hover { background: var(--hover); }
  .hrow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .chev { color: var(--faint); padding-top: 2px; } .hrow:hover .chev, .hnote.open .chev { color: var(--ink); }
  .hmain { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
  .htitle { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; color: var(--accent); border-radius: 3px; }
  .htitle:hover { text-decoration: underline; } .htitle:hover::after { content: "  ↗ open"; font-weight: 500; font-size: 11px; }
  .snip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); font-size: 12.5px; }
  .hmain small { color: var(--faint); font-size: 11.5px; }
  .hbody { position: relative; margin: 0 14px 0 30px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .hbody .doc { max-width: none; margin: 0; padding: 12px 18px; font-size: 14px; line-height: 1.6; } .hbody .doc h1 { font-size: 19px; margin-bottom: 4px; } .hbody .doc h2 { font-size: 15px; margin: 12px 0 2px; } .hbody .doc p { margin: 4px 0; }
  .hbody.short { max-height: 204px; overflow: hidden; } .hbody.short::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 44px; border-radius: 0 0 8px 8px; background: linear-gradient(#0000, var(--bg)); }
  .hbody.full { max-height: 320px; overflow: auto; }
  .hfoot { display: flex; align-items: center; gap: 14px; margin: 6px 14px 10px 30px; font-size: 12px; color: var(--muted); } .hfoot button { color: var(--accent); font-weight: 600; } .hfoot button:hover { text-decoration: underline; }

  /* round four: the quieter folder tab (Q1 river, Q2 quiet list, Q3 one at a time). One type scale, the editor's; accent only on focus and on links inside notes. */
  .qview { max-width: 720px; margin: 0 auto; padding: 24px clamp(14px, 6%, 40px) 90px; font-size: 14.5px; line-height: 1.6; }

  .qfilter input { width: 76px; border: 0; border-bottom: 1px solid transparent; background: none; color: var(--ink); font: inherit; outline: 0; padding: 0; transition: width .15s; }
  .qfilter input:focus { width: 150px; border-bottom-color: var(--accent); } .qfilter input::placeholder { color: var(--muted); }

  .qbody { position: relative; }
  .qnote.short .qbody { overflow: hidden; } .qnote.short .qbody::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: linear-gradient(#0000, var(--bg)); pointer-events: none; }
  .qmore { color: var(--faint); font-size: 12px; padding: 0 2px; border-radius: 3px; } .qmore:hover { color: var(--ink); }
  .qmore { display: block; margin-top: 1px; } .qnote.full .more, .qnote.short .less, .qnote.closed .less { display: none; }
  .wys { outline: 0; cursor: text; } .doc .wys { font-size: 15px; line-height: 1.65; }
  .wys p { margin: 5px 0; } .wys h2 { font-size: 1.05em; font-weight: 650; margin: 14px 0 2px; } .wys > :first-child { margin-top: 0; }
  .wys ul { margin: 5px 0; padding-left: 20px; } .wys a { color: var(--accent); } .wys code { font: 0.87em var(--mono); background: var(--hover); border-radius: 3px; padding: 1px 4px; }
  .wys .todo { display: flex; gap: 8px; align-items: baseline; } .wys .cb { width: 13px; height: 13px; border: 1.5px solid var(--line-strong); border-radius: 3px; flex: none; transform: translateY(2px); }

  .q2 .qnote:not(.closed) { margin-bottom: 8px; } .q2 .qbody { margin-left: 13px; } .q2 .qmore { margin-left: 28px; } .q2 .qbody { padding-left: 16px; border-left: 1px solid var(--line-strong); margin-top: 2px; }

  .q3 .qnote.short .qbody { max-height: 186px; }

  .q4 { max-width: 780px; margin: 0 auto; padding: 30px clamp(14px, 5%, 32px) 50vh; } .q4.grid { max-width: 1240px; }
  .q4head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; } .q4head h2 { margin: 0; font-size: 24px; letter-spacing: -.02em; } .q4head .n { color: var(--faint); font-size: 12.5px; padding-top: 6px; }

  /* prototype switcher: deliberately not the app's look */

  #proto .vs button.on, #proto .mk button.on { background: #f4f4f4; color: #111; font-weight: 700; }

<body>
<div id="app"></div>
<div id="proto"></div>
<script>
const MIN = 420; // the editor never gets narrower than this; panels give way first
const q = new URLSearchParams(location.search);
const S = {
  v: (q.get('v') || 'A').toUpperCase(),
  theme: q.get('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'),
  want: { folders: true, list: true, insp: true, nav: true },
  w: { folders: 216, list: 280, insp: 300, nav: 280, gl: 300 },
  recent: ['insp', 'list', 'folders'], // A: least recently asked for first; first gives way first
  over: null, writing: false, folder: null, inspTab: 'Info', step: 3, menu: false,
  gmode: +q.get('g') || 3, hmode: +q.get('h') || 1, q: q.get('q') == null ? 4 : +q.get('q'), grid: q.get('grid') === '1', qs: {}, qsort: 0, hx: q.get('x') === 'full' ? 'full' : 'short', hexp: new Set(), notes: q.get('notes') ? q.get('notes') === '1' : undefined, opened: [], toast: '', g: null,
  more: (q.get('more') || '').toLowerCase() || null, moreOpen: q.get('open') === '1', page: null,
};

const P = {
  drop: '<path d="M8 1.5C5.5 5 4 7.2 4 9.6a4 4 0 0 0 8 0C12 7.2 10.5 5 8 1.5z"/>',
  left: '<rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6 3v10"/>',
  list: '<path d="M5.5 4.5h8M5.5 8h8M5.5 11.5h8M2.5 4.5h.01M2.5 8h.01M2.5 11.5h.01"/>',
  right: '<rect x="2" y="3" width="12" height="10" rx="2"/><path d="M10 3v10"/>',
  write: '<path d="M2.5 6V3.5a1 1 0 0 1 1-1H6M10 2.5h2.5a1 1 0 0 1 1 1V6M13.5 10v2.5a1 1 0 0 1-1 1H10M6 13.5H3.5a1 1 0 0 1-1-1V10"/>',
  search: '<circle cx="7" cy="7" r="4.3"/><path d="M10.2 10.2 13.5 13.5"/>',
  dash: '<circle cx="8" cy="8" r="5.8"/><circle cx="8" cy="8" r="1.8"/>',
  todo: '<rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M5.5 8.2 7.3 10l3.4-3.8"/>',
  cal: '<rect x="2.5" y="3.5" width="11" height="10" rx="2"/><path d="M2.5 7h11M5.5 2v3M10.5 2v3"/>',
  more: '<path d="M3.5 8h.01M8 8h.01M12.5 8h.01"/>',
  plus: '<path d="M8 3.5v9M3.5 8h9"/>',
  back: '<path d="M9.5 3.5 5 8l4.5 4.5"/>',
  fwd: '<path d="M6.5 3.5 11 8l-4.5 4.5"/>',
  down: '<path d="M4 6.5 8 10.5l4-4"/>',
  folder: '<path d="M2 5a1.5 1.5 0 0 1 1.5-1.5h2.6l1.4 1.6h5A1.5 1.5 0 0 1 14 6.6v4.9a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"/>',
  all: '<path d="M8 2 2 5l6 3 6-3zM2 8l6 3 6-3M2 11l6 3 6-3"/>',

  x: '<path d="M4 4l8 8M12 4l-8 8"/>',

  doc: '<path d="M4 2.5h5l3 3v8H4zM9 2.5v3h3"/>',
  contacts: '<circle cx="8" cy="5.5" r="2.6"/><path d="M3 13.5c.4-2.6 2.4-4 5-4s4.6 1.4 5 4"/>',
  upload: '<path d="M8 10.5V2.5M5 5.2l3-2.9 3 2.9M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2"/>',
  plug: '<path d="M6 2v3.5M10 2v3.5M4 5.5h8v2.2a4 4 0 0 1-8 0zM8 11.7V14"/>',
  s3: '<rect x="2" y="3" width="12" height="10" rx="2"/><path d="M5.5 3v10M9 3v10"/>',
  s2: '<rect x="2" y="3" width="12" height="10" rx="2"/><path d="M7 3v10"/>',
  s1: '<rect x="2" y="3" width="12" height="10" rx="2"/>',

const ic = n => `<svg viewBox="0 0 16 16">${P[n]}</svg>`;

const FOLDERS = [['Unsorted', 2, 0], ['Projects', 5, 0], ['Common Ink', 3, 1], ['Website', 2, 1], ['Meetings', 2, 0], ['Journal', 2, 0], ['Reading', 1, 0]];
const NOTES = [
  ['Layout feedback', 'Panel toggles sit in the note header as if they belonged to the note. Move them up.', '3m ago · Dev User', 'Unsorted'],
  ['Try in this PR', 'This PR adds history: who changed a note and how, across the workspace, with…', '7m ago · Dev User', 'Unsorted'],
  ['Sync protocol notes', 'Yjs updates are batched per document and flushed on idle or every 2 s.', '1h ago · Dev User', 'Common Ink'],
  ['Agent tokens', 'Tokens are scoped to a workspace and can be revoked from Settings.', '5h ago · Shell agent', 'Common Ink'],
  ['v3 launch checklist', 'Redirect www to the apex, retire the v2 service worker, announce.', '16h ago · Dev User', 'Common Ink'],
  ['Landing page copy', 'An agent-first markdown notes app. Your notes, and your agents’ notes.', 'Yesterday · Dev User', 'Website'],
  ['Pricing ideas', 'Free for one workspace; paid for shared workspaces and long history.', '2d ago · Dev User', 'Website'],
  ['Weekly sync, Oct 5', 'Folders shipped. Next: history, backlinks, the narrow window.', '6d ago · Dev User', 'Meetings'],
  ['Design review', 'Rails in writing mode feel right. Inspector tabs: History, Backlinks, Info.', 'Sep 29 · Dev User', 'Meetings'],
  ['Oct 10', 'Rode to the reservoir. Wrote the uploads change on the train back.', 'Yesterday · Dev User', 'Journal'],
  ['Oct 9', 'Slow morning. Fixed the tab drag bug that only showed up in splits.', '2d ago · Dev User', 'Journal'],
  ['A Philosophy of Software Design', 'Deep modules: simple interface, a lot behind it. Shallow ones leak.', 'Sep 21 · Dev User', 'Reading'],
];
const notesFor = f => NOTES.filter(n => f == null || n[3] === f || (f === 'Projects' && (n[3] === 'Common Ink' || n[3] === 'Website')));
const W = () => innerWidth;

/* ---------- shared pieces (panels and the editor; each variant owns its own layout) ---------- */
const item = (icon, text, extra = '', attrs = '') => `<button class="item" ${attrs}>${ic(icon)}<span>${text}</span>${extra}</button>`;
const wsButton = () => `<button class="ws"><span class="drop">${ic('drop')}</span><span><b>Dev's workspace</b><small>Admin</small></span></button>`;
const tree = () => `<button class="item ${S.folder == null ? 'sel' : ''}" data-act="folder:">${ic('all')}<span>All notes</span><span class="n">12</span></button>` +
  FOLDERS.map(([n, c, d]) => `<button class="item ${S.folder === n ? 'sel' : ''}" style="padding-left:${9 + d * 18}px" data-act="folder:${n}" data-folder="${n}">${ic('folder')}<span>${n}</span><span class="n">${notesFor(n).length}</span></button>`).join('');
/* The More pages, four treatments (see MORE_KINDS). Every control is a real button with aria-expanded, so Tab / Enter / Space / Esc work. */
const MORE = [['contacts', 'Contacts'], ['upload', 'Uploads'], ['hist', 'History'], ['plug', 'Plugins']];
const MORE_KINDS = {
  a: 'Chevron row: "› More" closed, "⌄ Less" open, pages indented beneath.',
  b: 'Section: a small MORE heading like FOLDERS, with a chevron; pages beneath it.',
  c: 'No toggle: every page listed, the less-used ones quieter; folds into a "···" menu only when the window is short (try under 700 px tall).',
  d: 'Always a menu: "More ›" opens a popover and never changes its label; the page you pick is promoted into the list while you are on it.',
};
const moreKind = () => S.more || V[S.v].more;
const page = (icon, text, cls = '', extra = '') => `<button class="item ${cls} ${S.page === text ? 'sel' : ''}" data-act="page:${text}">${ic(icon)}<span>${text}</span>${extra}</button>`;
const morePages = cls => MORE.map(([i, t]) => page(i, t, cls)).join('');
const moreMenu = (cls = '') => S.moreOpen ? `<div class="menu ${cls}" role="menu">${morePages('')}</div>` : '';
const moreIcon = (cls, mcls) => `<span class="rel"><button class="icon-button ${cls} ${S.moreOpen ? 'on' : ''}" data-act="more" aria-haspopup="menu" aria-expanded="${S.moreOpen}" data-tip="More pages">${ic('more')}</button>${moreMenu(mcls)}</span>`;
function navBody() {
  const k = moreKind(), o = S.moreOpen, x = `aria-expanded="${o}" data-act="more"`;
  const main = page('dash', 'Dashboard') + page('search', 'Search', '', '<kbd>⌘K</kbd>') + page('todo', 'Todos') + page('cal', 'Calendar');
  if (k === 'a') return main + `<button class="item" ${x}>${ic(o ? 'down' : 'fwd')}<span>${o ? 'Less' : 'More'}</span></button>` + (o ? morePages('ind') : '');
  if (k === 'b') return main + `<button class="label lbtn" ${x}><span>${ic(o ? 'down' : 'fwd')}More</span></button>` + (o ? morePages('') : '');
  if (k === 'c') return main + (innerHeight >= 700 ? morePages('quiet')
    : `<div class="rel"><button class="item" aria-haspopup="menu" ${x}>${ic('more')}<span>4 more pages</span></button>${moreMenu()}</div>`);
  const promoted = MORE.find(m => m[1] === S.page);
  return main + (promoted ? page(promoted[0], promoted[1]) : '') + `<div class="rel"><button class="item" aria-haspopup="menu" ${x}>${ic('more')}<span>More</span>${ic('fwd')}</button>${moreMenu()}</div>`;
}
const foldersBody = (nav = true) => wsButton() + (nav ? navBody() : '') + `<div class="label">Folders ${ic('plus')}</div>` + tree();
const noteRows = f => notesFor(f).map((n, i) => `<button class="note ${n === NOTES[0] ? 'sel' : ''}"><b>${n[0]}</b><span>${n[1]}</span><small>${n[2]}</small></button>`).join('');
const listTools = f => `<div class="list-tools"><input class="filter" placeholder="Filter ${notesFor(f).length} notes"><div class="pills"><span class="pill on">Recent</span><span class="pill">Created</span><span class="pill">Title</span><span class="pill">Has todos</span></div></div>`;
const backToAll = () => S.folder != null ? `<button class="back" data-act="folder:">${ic('back')}All notes</button>` : '';
const listBody = (picker) => backToAll() + `<div class="list-head">` +
  (picker ? `<button class="picker" data-act="menu"><h2>${S.folder || 'All notes'}</h2>${ic('down')}</button>` : `<h2>${S.folder || 'All notes'}</h2>`) +
  `<span class="sp"></span><span class="icon-button">${ic('plus')}</span>` +
  (picker && S.menu ? `<div class="menu">${tree()}</div>` : '') + `</div>` + listTools(S.folder) + noteRows(S.folder);
const inspBody = () => `<div class="itabs">${['History', 'Backlinks', 'Info'].map(t => `<button class="${S.inspTab === t ? 'sel' : ''}" data-act="itab:${t}">${t}</button>`).join('')}</div><div class="ibody">` + ({
  Info: `<h4>Folder</h4><p>Unsorted</p><div class="box">Unsorted</div><h4>Sharing</h4><p>Everyone in this workspace</p><p class="muted">Sharing with people and links arrives with #15.</p><h4>Tags</h4><p class="muted">Tags arrive with #21.</p><h4>URL</h4><div class="box mono">https://commonink.app/note/layout-feedback-3r9v</div><h4>Archive</h4><span class="box">Archive</span>`,
  History: `<h4>Today</h4><p>Dev User <span class="muted">· 3m ago</span></p><div class="box mono">+ Move the toggles out of the note tab</div><h4>Yesterday</h4><p>Shell agent <span class="muted">· 16h ago</span></p><div class="box mono">+ - [ ] Prototype narrow layouts</div>`,
  Backlinks: `<h4>2 notes link here</h4><p>Weekly sync, Oct 5</p><p class="muted">…see [[Layout feedback]] for the narrow window…</p><p>v3 launch checklist</p><p class="muted">…blocked on [[Layout feedback]]…</p>`,
})[S.inspTab] + `</div>`;
const BODY = { folders: () => foldersBody(V[S.v].navInPanel !== false), list: () => listBody(false), insp: inspBody };
const panel = (p, body, over) => `<aside class="panel p-${p} ${over ? 'over' : ''}" style="width:${S.w[p]}px">${(body || BODY[p])()}</aside>`;
const split = (p, dir) => `<div class="split" data-split="${p}" data-dir="${dir}"></div>`;
const overlay = bodies => S.over ? `<div class="scrim" data-act="close"></div>` + panel(S.over, (bodies || {})[S.over], true) : '';

// The note header now holds only what belongs to the note. tl / tr are cells on the tab row for variants that put controls there.
const DOC0 = `<h1><span class="h"># </span>Layout feedback</h1>
  <p>After trying the previews for the app layout. Four things, roughly in order of how much they bother me.</p>
  <h2><span class="h">## </span>The toggles are not part of a note</h2>
  <p>The collapse-inspector and writing-mode buttons sit in the note's header bar, under its tab, as if they belonged to that note. They belong to the app. Move them up and out of the note tab.</p>
  <h2><span class="h">## </span>Narrow windows</h2>
  <p>At about 870 px the two left columns and the inspector take the room. The editor is a sliver and I can't even see the button to expand the note. The left panels need a way to collapse.</p>
  <h2><span class="h">## </span>Also</h2>
  <div class="todo"><span class="cb"></span><span>Drag the panel edges to resize them</span></div>
  <div class="todo"><span class="cb"></span><span>A way back to All notes</span></div>
  <div class="todo"><span class="cb"></span><span>Prototype some options before building</span></div>`;
const editor = (tl = '', tr = '', ov = overlay()) => `<div class="main"><div class="tabrow">${tl}<div class="tab-bar">
  <div class="tab sel"><span>Layout feedback</span><i>×</i></div><div class="tab preview"><span>Try in this PR</span><i>×</i></div></div>${tr}</div>
  <div class="note-head"><b>Unsorted</b><span class="muted">edited 3m ago by Dev User</span><span class="sp"></span><span class="muted">Saved</span></div>
  <div class="pane"><div class="doc">${DOC0}
  </div></div>${ov}</div>`;

/* ---------- fitting: drop panels, in the given order, until the editor has MIN ---------- */
function fit(order, chrome) {
  const on = {}; let used = chrome;
  for (const p of order) { on[p] = S.want[p] && !S.writing; if (on[p]) used += S.w[p]; }
  for (const p of order) { if (W() - used >= MIN) break; if (on[p]) { on[p] = false; used -= S.w[p]; } }
  return on;
}
const stateOf = (p, on) => on[p] ? 'on' : S.over === p ? 'on' : (V[S.v].wants(p) && !S.writing ? 'auto' : '');
const tip = (label, k) => `${label}  ${k}`;
const ibtn = (p, on, icon, label, k, cls = '') => `<button class="icon-button ${stateOf(p, on)} ${cls}" data-act="toggle:${p}" data-tip="${tip(label, k)}">${ic(icon)}</button>`;
const wbtn = (cls = '') => `<button class="icon-button ${S.writing ? 'on' : ''} ${cls}" data-act="writing" data-tip="${tip('Writing mode', '⌘.')}">${ic('write')}</button>`;

/* ---------- variants ---------- */
const V = {
  A: {
    name: 'Top bar', more: 'a',
    pro: 'Toggles are plainly app-level and never move; the workspace switcher and search stay reachable when every panel is gone. Opening a panel that does not fit pushes out the one you used longest ago, so everything stays a real column.',
    con: 'Costs a 40 px row on every screen, and a panel closing on its own when you open another can surprise.',

    ${S.notes ?? W() >= 900 ? `<div class="l2"><b>+</b> ${v.pro} <i>−</i> ${v.con}${S.v === 'G' ? `<br><b>G${S.gmode}</b> ${GM[S.gmode]}` : ''}${S.v === 'H' ? `<br>${HM[S.hmode]}<br>${S.q ? QT[S.q] + (S.q === 4 ? ' ⌘-click or middle-click opens a note behind; ↑↓ Enter ⌘Enter.' : ' Click text to edit in place; click a title to open it in a tab; ⌘-click or middle-click opens it behind; ↑↓ Enter ⌘Enter Esc.') : `<b>Expanded (${S.hx})</b> ${HX[S.hx]}`}` : ''}${V[S.v].navInPanel === false || S.v === 'C' ? '' : `<br><b>More (${moreKind()})</b> ${MORE_KINDS[moreKind()]}`}</div>` : ''}`;
  document.documentElement.style.setProperty('--pb', document.getElementById('proto').offsetHeight + 20 + 'px');
}

/* ---------- actions ---------- */
function toggle(p) {
  S.menu = false;
  if (S.v === 'F' && p !== 'insp') return ftoggle(p);
  const on = V[S.v].on();
  if (on[p]) { S.want[p] = false; S.over = null; }
  else if (S.over === p) { S.over = null; if (S.v !== 'B') S.want[p] = S.want[p] && !S.writing; }
  else {
    S.want[p] = true;
    S.recent = S.recent.filter(x => x !== p).concat(p); // A: the panel just asked for is the last to give way
    S.over = V[S.v].on()[p] ? null : p;
  }
}
const ACT = {
  toggle, close: () => { S.over = null; S.menu = false; S.moreOpen = false; },
  writing: () => { S.writing = !S.writing; S.over = null; },
  folder: f => { if (S.v === 'H' && S.hmode === 1) { if (S.over === 'folders') S.over = null; return gFolder(f || ''); }
    if (S.v === 'G') { if (S.over === 'folders') S.over = null; return gFolder(f || ''); } // a floating tree gets out of the way so the folder tab shows
    if (S.v === 'F' && (!S.want.list || S.writing)) { if (S.writing) ftoggle('list'); else { S.want.list = true; S.opened.push('list'); } }
    S.folder = f || null; S.menu = false; S.page = null; },
  allnotes: () => { if (S.v === 'G') return gFolder(''); S.folder = null; if (!V[S.v].on().list) S.over = 'list'; },
  itab: t => { S.inspTab = t; },
  insp: t => { const open = V[S.v].on().insp || S.over === 'insp'; if (open && S.inspTab !== t) S.inspTab = t; else { S.inspTab = t; toggle('insp'); } },
  peek: p => { S.over = S.over === p ? null : p; },
  menu: () => { S.menu = !S.menu; },
  more: () => { S.moreOpen = !S.moreOpen; },
  page: t => { if (TAB()) { S.moreOpen = false; return openTab(S.g.focus, { kind: 'page', id: t }); } S.page = t; if (!'ab'.includes(moreKind()) || V[S.v].navInPanel === false || S.v === 'C') S.moreOpen = false; },
  morekind: k => { S.more = k; S.moreOpen = false; url(); },
  step: n => { n = +n; S.over = null; if (n === 1) S.writing = true; else { S.writing = false; S.step = n; } },
  theme: () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; url(); },
  v: k => { S.v = k; S.over = null; S.menu = false; S.folder = null; S.page = null; S.writing = false; S.want.folders = S.want.list = S.want.insp = true; if (k === 'G') gInit(); if (k === 'F') fInit(); if (k === 'H') hInit(); url(); },
  hmode: n => { S.hmode = +n; S.want.list = true; hInit(); url(); },
  hx: n => { S.hx = n; url(); },
  q: n => { S.q = +n; S.qs = {}; url(); },
  qexp: k => { if (S.q === 4 && qst(+k) !== 'closed') S.reveal = +k; qExp(+k); },
  qfull: k => { k = +k; S.qs[k] = qst(k) === 'full' ? 'short' : 'full'; },
  qsortset: i => { S.qsort = +i; },
  grid: n => { S.grid = n === '1'; url(); },
  qsort: () => { S.qsort = (S.qsort + 1) % SORTS.length; },
  hexp: k => { k = +k; S.hexp.has(k) ? S.hexp.delete(k) : S.hexp.add(k); },
  hopen: k => { const g = S.g; S.focusEd = S.q > 0; openTab(g.panes.length === 2 ? 1 - g.focus : g.focus, { kind: 'note', id: +k }); }, // with a split, notes open in the other pane
  hnote: k => openTab(S.g.focus, { kind: 'note', id: +k }),
  hastab: () => gFolder(S.folder || ''),
  hsplit: () => { const g = S.g; if (g.panes.length === 2) return; const p = g.panes[g.focus], t = p.tabs[p.active]; if (!t) return;
    if (p.tabs.length > 1) { p.tabs.splice(p.active, 1); p.active = Math.max(0, p.active - 1); g.panes.push({ tabs: [t], active: 0 }); } else g.panes.push({ tabs: [{ ...t }], active: 0 });
    g.focus = 1; },
  esc: () => { if (S.menu || S.moreOpen) S.menu = S.moreOpen = false; else if (S.over) S.over = null; else if (S.v === 'F' && S.opened.length) S.want[S.opened.pop()] = false; },
  closefloat: () => { for (const p of V.F.lay().fl) { S.want[p] = false; S.opened = S.opened.filter(x => x !== p); } },
  gmode: n => { S.gmode = +n; gInit(); url(); },
  gnote: i => gNote(+i),
  gnav: f => { const p = S.g.panes[S.g.focus]; p.tabs[p.active] = { ...p.tabs[p.active], id: f }; },
  gback: () => { const p = S.g.panes[S.g.focus], t = p.tabs[p.active]; p.tabs[p.active] = { kind: 'folder', id: t.back, preview: t.preview }; },
  gtab: a => { const [i, j] = a.split('.').map(Number); S.g.focus = i; S.g.panes[i].active = j; last = { tab: S.g.panes[i].tabs[j], at: Date.now() }; },
  gclose: a => { const [i, j] = a.split('.').map(Number), g = S.g, p = g.panes[i]; p.tabs.splice(j, 1); if (p.active > j || p.active >= p.tabs.length) p.active = Math.max(0, p.active - 1);
    if (!p.tabs.length && g.panes.length === 2) { g.panes.splice(i, 1); g.focus = 0; } },
  notes: () => { S.notes = !(S.notes ?? W() >= 900); },
  gfocus: () => { S.g.focus = 1 - S.g.focus; },
  cycle: d => { const k = Object.keys(V); ACT.v(k[(k.indexOf(S.v) + +d + k.length) % k.length]); },
};
function url() { const u = new URL(location.href); u.searchParams.set('v', S.v); u.searchParams.set('theme', S.theme); if (S.more) u.searchParams.set('more', S.more); if (S.v === 'G') u.searchParams.set('g', S.gmode); else u.searchParams.delete('g');
  if (S.v === 'H') { u.searchParams.set('h', S.hmode); u.searchParams.set('q', S.q); if (S.q === 4 && S.grid) u.searchParams.set('grid', 1); else u.searchParams.delete('grid'); if (S.q) u.searchParams.delete('x'); else u.searchParams.set('x', S.hx); } else { u.searchParams.delete('h'); u.searchParams.delete('x'); u.searchParams.delete('q'); } history.replaceState(null, '', u); }

document.addEventListener('click', e => {
  if (S.v === 'H' && (e.metaKey || e.ctrlKey)) { const o = e.target.closest('[data-open]'); if (o) { hBg(+o.dataset.open); e.preventDefault(); render(); return; } }
  if (TAB() && e.detail >= 2 && last && Date.now() - last.at < 600) { last.tab.preview = false; last = null; render(); return; } // double click keeps the tab
  const sec = e.target.closest('[data-pane]'); if (sec && TAB() && S.g.panes[+sec.dataset.pane]) S.g.focus = +sec.dataset.pane;
  const a = e.target.closest('[data-act]');
  if (!a) { if (S.menu || (S.moreOpen && !'ab'.includes(moreKind()))) { S.menu = S.moreOpen = false; render(); } return; }
  const [name, arg] = a.dataset.act.split(':'); ACT[name](arg); render();
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { // Enter on a row expands it; Enter on the title (a real button) opens it
    const [name, arg] = e.target.dataset.act.split(':'); ACT[name](arg); e.preventDefault(); render(); return; }
  const wys = e.target.closest?.('.wys'), qn = e.target.closest?.('.qnote');
  if (qn) { const k = +qn.dataset.fk, mod2 = e.metaKey || e.ctrlKey;
    if (mod2 && e.key === 'Enter') { ACT.hopen(k); e.preventDefault(); render(); return; }
    if (wys && e.key === 'Escape') { wys.blur(); qn.focus(); e.preventDefault(); return; }      // Esc leaves in-place editing, back to the note in the list
    if (!wys && e.target === qn) {
      if (e.key === 'Enter') { qExp(k); e.preventDefault(); render(); return; }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { const to = e.key === 'ArrowDown' ? qn.nextElementSibling : qn.previousElementSibling; e.preventDefault();
        if (to?.matches('.qnote')) { if (S.q === 3 && Object.keys(S.qs).length) { S.qs = { [+to.dataset.fk]: 'short' }; render(); document.querySelector(`[data-fk="${to.dataset.fk}"]`)?.focus(); } else to.focus(); to.scrollIntoView?.({ block: 'nearest' }); }
        return; } } }
  const typing = e.target.matches('input, textarea, [contenteditable]');
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key === '\\') {
    if (S.v === 'E') ACT.step(S.writing ? V.E.maxStep() : V.E.step() === 3 ? 2 : V.E.step() === 2 ? 1 : 3);
    else toggle(S.v === 'C' ? 'nav' : e.shiftKey && S.v !== 'G' && !(S.v === 'H' && S.hmode === 1) ? 'list' : 'folders');
  } else if (mod && e.key === '|') toggle(S.v === 'C' ? 'nav' : S.v === 'G' || (S.v === 'H' && S.hmode === 1) ? 'folders' : 'list');
  else if (mod && e.key.toLowerCase() === 'i') toggle('insp');
  else if (mod && e.key === '.') ACT.writing();
  else if (e.key === 'Escape') ACT.esc();
  else if (!typing && !mod && e.key === 'ArrowLeft') ACT.cycle(-1);
  else if (!typing && !mod && e.key === 'ArrowRight') ACT.cycle(1);
  else return;
  e.preventDefault(); render();
});

/* drag a panel edge to resize; widths live in memory only, and the editor keeps MIN */
let drag = null;
document.addEventListener('pointerdown', e => {
  const s = e.target.closest('.split'); if (!s) return;
  const p = s.dataset.split;
  drag = { p, dir: +s.dataset.dir, x: e.clientX, w: S.w[p], max: S.w[p] + (document.querySelector('[data-ed]') || document.querySelector('.main')).clientWidth - MIN };
  document.body.classList.add('dragging'); e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  S.w[drag.p] = Math.max(160, Math.min(drag.max, drag.w + drag.dir * (e.clientX - drag.x)));
  render();
  document.querySelector(`.split[data-split="${drag.p}"]`)?.classList.add('drag');
});
document.addEventListener('pointerup', () => { if (drag) { drag = null; document.body.classList.remove('dragging'); render(); } });
/* G: drag a note from a folder tab onto a folder in the tree (or a child-folder chip) to move it. Faked: it just retags the note. */
let dragNote = null;
document.addEventListener('dragstart', e => { const n = e.target.closest?.('[data-note]'); if (n) { dragNote = +n.dataset.note; e.dataTransfer.setData('text/plain', NOTES[dragNote][0]); } });
document.addEventListener('dragover', e => { const f = e.target.closest?.('[data-folder]'); if (f && dragNote != null) { e.preventDefault(); f.classList.add('dropping'); } });
document.addEventListener('dragleave', e => e.target.closest?.('[data-folder]')?.classList.remove('dropping'));
document.addEventListener('drop', e => { const f = e.target.closest?.('[data-folder]'); if (!f || dragNote == null) return; e.preventDefault();
  NOTES[dragNote][3] = f.dataset.folder; S.toast = `moved "${NOTES[dragNote][0]}" to ${f.dataset.folder}`; dragNote = null; render(); });
document.addEventListener('dragend', () => { dragNote = null; });
/* in-place editing (faked): the rendered preview is contenteditable; edits are kept in memory and mirrored to the same note open elsewhere */
document.addEventListener('auxclick', e => { if (e.button !== 1 || S.v !== 'H') return; const o = e.target.closest('[data-open]'); if (o) { hBg(+o.dataset.open); e.preventDefault(); render(); } });
document.addEventListener('mousedown', e => { if (e.button === 1 && e.target.closest?.('[data-open]')) e.preventDefault(); });
document.addEventListener('focusin', e => { const w = e.target.closest?.('.qview.q3 .wys'); if (!w) return; const n = w.closest('.qnote'); // Q3: clicking into the text shows the whole note
  if (n.classList.contains('short')) { n.classList.replace('short', 'full'); S.qs[+w.dataset.edit] = 'full'; } });
document.addEventListener('input', e => { const w = e.target.closest?.('.wys[data-edit]'); if (!w) return; const k = w.dataset.edit;
  NOTE_HTML[k] = w.innerHTML.replace(/ class="cur"/g, '').replace(/ cur"/g, '"');
  document.querySelectorAll(`.wys[data-edit="${k}"]`).forEach(x => { if (x !== w) x.innerHTML = NOTE_HTML[k]; });
  const sv = w.closest('.qnote')?.querySelector('.qsaved'); if (sv) { sv.textContent = 'Saving…'; clearTimeout(sv._t); sv._t = setTimeout(() => { sv.textContent = 'Saved'; }, 700); } });
document.addEventListener('selectionchange', () => { // the block with the cursor shows its markdown mark, as the editor does
  document.querySelectorAll('.wys .cur').forEach(x => x.classList.remove('cur'));
  const w = document.activeElement; if (!w?.matches?.('.wys')) return; let n = getSelection().anchorNode; n = n && (n.nodeType === 1 ? n : n.parentElement);
  while (n && n !== w && n.parentElement !== w) n = n.parentElement; if (n && n !== w) n.classList.add('cur'); });
addEventListener('resize', render);
render();
</script>
</body>
